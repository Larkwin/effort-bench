<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Even Keel — trip expense splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --harbour:#1F3A4D;--harbour-2:#2E5570;--signal:#C2462B;--signal-d:#A53820;
  --paper:#F5F1E8;--card:#FFFFFF;--ink:#16242E;--muted:#506270;--line:#D9D3C4;
  --owed:#1C6B4A;--owe:#A53820;--tint:#E8EEF1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
header.top{background:var(--harbour);color:#fff;padding:20px 16px 22px;border-bottom:4px solid var(--signal)}
.wrap{max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.7rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.tag{margin:2px 0 0;color:#D3DEE5;font-size:.95rem}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:1fr 1fr;align-items:start}.col{display:grid;gap:20px}}
.col{display:grid;gap:20px;min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
h2{font-family:Fraunces,Georgia,serif;font-size:1.3rem;margin:0 0 12px;color:var(--harbour);line-height:1.2}
label,.lbl{display:block;font-weight:600;font-size:.9rem;margin:0 0 4px;color:var(--ink)}
input[type=text],input[type=number],input:not([type]),select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #7B8A94;border-radius:6px;background:#fff;color:var(--ink);min-height:44px}
.field{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.row .field{flex:1;margin:0;min-width:0}
button{font:inherit;font-weight:600;min-height:44px;padding:8px 16px;border-radius:6px;border:2px solid var(--harbour);background:var(--harbour);color:#fff;cursor:pointer}
button:hover{background:var(--harbour-2);border-color:var(--harbour-2)}
button.primary{background:var(--signal);border-color:var(--signal)}
button.primary:hover{background:var(--signal-d);border-color:var(--signal-d)}
button.ghost{background:transparent;color:var(--harbour);border-color:var(--line);min-height:36px;padding:4px 12px;font-size:.9rem}
button.ghost:hover{background:var(--tint);border-color:var(--harbour)}
:focus-visible{outline:3px solid #E58A00;outline-offset:2px}
header :focus-visible{outline-color:#fff}
.err{margin:8px 0 0;padding:8px 12px;background:#FBE9E4;border-left:4px solid var(--signal);color:#7A220F;font-weight:500;border-radius:4px}
.err:empty{display:none}
ul{list-style:none;margin:0;padding:0}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.people li{background:var(--tint);color:var(--harbour);padding:6px 14px;border-radius:99px;font-weight:600;overflow-wrap:anywhere}
.empty{color:var(--muted);margin:12px 0 0;padding:14px;border:1.5px dashed var(--line);border-radius:8px;background:#FBFAF6}
fieldset{border:0;margin:0 0 12px;padding:0;min-width:0}
legend{padding:0;font-weight:600;font-size:.9rem;margin-bottom:4px}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.split label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;min-height:44px;cursor:pointer;overflow-wrap:anywhere}
.split input{width:20px;height:20px;accent-color:var(--harbour);flex:none}
.exp{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.exp:first-child{border-top:0}
.exp .d{font-weight:700;overflow-wrap:anywhere}
.exp .m{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bal{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.bal:first-child{border-top:0}
.bal .n{font-weight:600;overflow-wrap:anywhere}
.bal .s{display:block;font-size:.85rem;font-weight:500;color:var(--muted)}
.pos{color:var(--owed)}.neg{color:var(--owe)}.zero{color:var(--muted)}
.bal .amt{text-align:right}
.tr{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;background:var(--tint);border-radius:8px;border-left:5px solid var(--signal);flex-wrap:wrap;justify-content:space-between}
.tr .t{overflow-wrap:anywhere;min-width:0;flex:1 1 180px}
.note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
</style>
</head>
<body>
<header class="top"><div class="wrap brand">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="#fff" stroke-width="2"/><path d="M6 22h28" stroke="#C2462B" stroke-width="3"/><path d="M20 8v14M20 22l-7 9h14z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
<div><h1>Even Keel</h1><p class="tag">Share the costs. Owing a friend is normal, so let’s keep it level.</p></div>
</div></header>

<main data-testid="app">
<div class="col">
<section aria-labelledby="h-people">
<h2 id="h-people">People on this trip</h2>
<form id="pf" novalidate>
<div class="row"><div class="field"><label for="pname">Name</label><input id="pname" type="text" data-testid="person-name" autocomplete="off"></div>
<button type="submit" data-testid="add-person">Add person</button></div>
<div id="perr" role="alert"></div>
</form>
<div id="plist"></div>
</section>

<section aria-labelledby="h-add">
<h2 id="h-add">Log an expense</h2>
<form id="ef" novalidate>
<div class="field"><label for="edesc">What was it for?</label><input id="edesc" type="text" data-testid="expense-desc" autocomplete="off"></div>
<div class="field"><label for="eamt">Amount (CAD)</label><input id="eamt" type="text" inputmode="decimal" data-testid="expense-amount" autocomplete="off" placeholder="0.00"></div>
<div class="field"><label for="epayer">Who paid?</label><select id="epayer" data-testid="expense-payer"></select></div>
<fieldset><legend>Split between</legend><div class="split" id="esplit" data-testid="expense-split"></div></fieldset>
<button type="submit" class="primary" data-testid="add-expense">Add expense</button>
<div id="eerr" role="alert"></div>
</form>
</section>
</div>

<div class="col">
<section aria-labelledby="h-bal">
<h2 id="h-bal">Balances</h2>
<div id="blist"></div>
</section>
<section aria-labelledby="h-set">
<h2 id="h-set">Settle up</h2>
<div id="slist"></div>
</section>
<section aria-labelledby="h-exp">
<h2 id="h-exp">Expenses</h2>
<div id="xlist"></div>
</section>
</div>
</main>

<script>
(function(){
const fmt=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
const money=c=>fmt.format(c/100);
const KEY='evenkeel.v1';
let state={people:[],expenses:[],nid:1};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people)&&Array.isArray(s.expenses))state=Object.assign(state,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showErr(id,msg){const el=$(id);el.innerHTML=msg?'<p class="err" data-testid="form-error">'+esc(msg)+'</p>':''}

function shares(e){
  const order=state.people.map(p=>p.name).filter(n=>e.split.includes(n));
  const k=order.length,base=Math.floor(e.cents/k),rem=e.cents-base*k;
  const out={};order.forEach((n,i)=>out[n]=base+(i<rem?1:0));return out;
}
function balances(){
  const b={};state.people.forEach(p=>b[p.name]=0);
  state.expenses.forEach(e=>{
    if(b[e.payer]!==undefined)b[e.payer]+=e.cents;
    const s=shares(e);for(const n in s)b[n]-=s[n];
  });
  return b;
}
function transfers(b){
  const cr=[],db=[];
  state.people.forEach(p=>{const v=b[p.name];if(v>0)cr.push({n:p.name,v});else if(v<0)db.push({n:p.name,v:-v})});
  const out=[];
  cr.sort((a,b)=>b.v-a.v);db.sort((a,b)=>b.v-a.v);
  let i=0,j=0;
  while(i<cr.length&&j<db.length){
    const m=Math.min(cr[i].v,db[j].v);
    out.push({from:db[j].n,to:cr[i].n,c:m});
    cr[i].v-=m;db[j].v-=m;
    if(!cr[i].v)i++;if(!db[j].v)j++;
  }
  return out;
}

function renderPeople(){
  const el=$('plist');
  el.innerHTML=state.people.length?'<ul class="people">'+state.people.map(p=>'<li data-testid="person">'+esc(p.name)+'</li>').join('')+'</ul>':'<p class="empty">No one is on the trip yet. Add the first name above to get started.</p>';
}
function renderForm(){
  const sel=$('epayer'),prevP=sel.value;
  const checked=new Set([...document.querySelectorAll('#esplit input:checked')].map(i=>i.value));
  const had=new Set([...document.querySelectorAll('#esplit input')].map(i=>i.value));
  if(!state.people.length){sel.innerHTML='<option value="">Add people first</option>';$('esplit').innerHTML='<p class="note">Everyone you add will appear here.</p>';return}
  sel.innerHTML=state.people.map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>').join('');
  if(state.people.some(p=>p.name===prevP))sel.value=prevP;
  $('esplit').innerHTML=state.people.map((p,i)=>'<label><input type="checkbox" value="'+esc(p.name)+'"'+((!had.has(p.name)||checked.has(p.name))?' checked':'')+'> <span>'+esc(p.name)+'</span></label>').join('');
}
function renderExpenses(){
  const el=$('xlist');
  if(!state.expenses.length){el.innerHTML='<p class="empty">No expenses yet. When someone pays for something, log it here and Even Keel will do the sums.</p>';return}
  el.innerHTML='<ul>'+state.expenses.slice().reverse().map(e=>{
    const s=shares(e);
    return '<li class="exp" data-testid="expense"><div><div class="d">'+esc(e.desc)+'</div><div class="m">Paid by '+esc(e.payer)+' · Split between '+Object.keys(s).map(esc).join(', ')+'</div></div><div class="r"><span class="amt">'+money(e.cents)+'</span><button type="button" class="ghost" data-testid="delete-expense" data-id="'+e.id+'" aria-label="Remove '+esc(e.desc)+'">Remove</button></div></li>';
  }).join('')+'</ul>';
}
function renderBalances(){
  const b=balances(),bel=$('blist'),sel=$('slist');
  if(!state.people.length){bel.innerHTML='<p class="empty">Balances appear once people are on the trip.</p>';sel.innerHTML='<p class="empty">Nothing to settle yet.</p>';return}
  bel.innerHTML=state.people.map(p=>{
    const v=b[p.name],cls=v>0?'pos':v<0?'neg':'zero';
    const txt=v>0?'is owed':v<0?'owes':'is all square';
    return '<div class="bal" data-testid="balance" data-person="'+esc(p.name)+'" data-cents="'+v+'"><span class="n">'+esc(p.name)+'<span class="s">'+txt+'</span></span><span class="amt '+cls+'">'+(v>0?'+':v<0?'−':'')+money(Math.abs(v))+'</span></div>';
  }).join('');
  const t=transfers(b);
  if(!t.length){sel.innerHTML='<p class="empty">'+(state.expenses.length?'Everyone is even. Nothing to pay back.':'No transfers needed yet. Log an expense to see who pays whom.')+'</p>';return}
  sel.innerHTML='<p class="note">'+t.length+' payment'+(t.length>1?'s':'')+' will bring everyone level.</p>'+t.map(x=>'<div class="tr" data-testid="transfer" data-from="'+esc(x.from)+'" data-to="'+esc(x.to)+'" data-cents="'+x.c+'"><span class="t"><strong>'+esc(x.from)+'</strong> pays <strong>'+esc(x.to)+'</strong></span><span class="amt">'+money(x.c)+'</span></div>').join('');
}
function render(){renderPeople();renderForm();renderExpenses();renderBalances()}

$('pf').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('pname').value.trim();
  if(!name)return showErr('perr','Enter a name to add someone.');
  if(state.people.some(p=>p.name.toLowerCase()===name.toLowerCase()))return showErr('perr','“'+name+'” is already on the trip. Names must be different, ignoring capitals.');
  state.people.push({name});save();showErr('perr','');$('pname').value='';render();$('pname').focus();
});
$('pname').addEventListener('input',()=>showErr('perr',''));

$('ef').addEventListener('submit',e=>{
  e.preventDefault();
  const desc=$('edesc').value.trim(),raw=$('eamt').value.trim().replace(/^\$/,'').replace(/,/g,'');
  const payer=$('epayer').value;
  const split=[...document.querySelectorAll('#esplit input:checked')].map(i=>i.value);
  let m;
  if(!state.people.length)return showErr('eerr','Add at least one person before logging an expense.');
  if(!desc)return showErr('eerr','Add a description so everyone knows what this was for.');
  if(!raw)return showErr('eerr','Enter the amount in Canadian dollars.');
  if(!/^(\d+(\.\d{0,2})?|\.\d{1,2})$/.test(raw)){
    return showErr('eerr',/^\d*\.\d{3,}$/.test(raw)?'The amount can have at most 2 decimal places.':'Enter the amount as a number, like 42.50.');
  }
  const cents=Math.round(parseFloat(raw)*100);
  if(!(cents>0))return showErr('eerr','The amount must be greater than $0.00.');
  if(!payer)return showErr('eerr','Choose who paid.');
  if(!split.length)return showErr('eerr','Choose at least one person to split this between.');
  state.expenses.push({id:state.nid++,desc,cents,payer,split});save();
  showErr('eerr','');$('edesc').value='';$('eamt').value='';
  document.querySelectorAll('#esplit input').forEach(i=>i.checked=true);
  render();$('edesc').focus();
});
$('xlist').addEventListener('click',e=>{
  const b=e.target.closest('[data-testid=delete-expense]');if(!b)return;
  state.expenses=state.expenses.filter(x=>String(x.id)!==b.dataset.id);save();render();
  $('edesc').focus();
});
render();
})();
</script>
</body>
</html>
