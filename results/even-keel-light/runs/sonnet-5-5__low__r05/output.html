<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Even Keel · Trip expense splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --harbour:#1F3A4D;--harbour-2:#2d5068;--signal:#C2462B;--signal-d:#a53a22;
  --paper:#F5F1E8;--card:#FFFFFF;--ink:#1b2830;--muted:#55656f;--line:#d8d2c3;
  --owed:#1d6b4a;--owe:#a53a22;--tint:#E8EEF1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
header{background:var(--harbour);color:#fff;padding:22px 16px 26px;border-bottom:6px solid var(--signal)}
.wrap{max-width:1040px;margin:0 auto}
header h1{font-size:2rem;line-height:1.1}
header p{margin:6px 0 0;color:#cfdbe3;max-width:52ch}
main{max-width:1040px;margin:0 auto;padding:20px 16px 56px;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:1fr 1fr;align-items:start}.full{grid-column:1/-1}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
section h2{font-size:1.3rem;color:var(--harbour);margin-bottom:12px}
label,legend{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px;color:var(--harbour)}
fieldset{border:0;padding:0;margin:0 0 12px}
input[type=text],input[type=number],input:not([type]),select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #8a979f;border-radius:8px;background:#fff;color:var(--ink);min-height:44px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1 1 180px}
.field{margin-bottom:12px}
button{font:inherit;font-weight:600;min-height:44px;padding:8px 16px;border-radius:8px;border:2px solid var(--harbour);background:var(--harbour);color:#fff;cursor:pointer}
button:hover{background:var(--harbour-2)}
button.sec{background:#fff;color:var(--harbour)}
button.sec:hover{background:var(--tint)}
button.danger{background:#fff;color:var(--signal-d);border-color:var(--signal-d);min-height:40px;padding:4px 12px}
button.danger:hover{background:#fbeae6}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.err{background:#fbeae6;color:#7d2412;border-left:4px solid var(--signal);padding:8px 12px;border-radius:4px;margin:0 0 12px;font-weight:500}
.err[hidden]{display:none}
ul{list-style:none;margin:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--tint);color:var(--harbour);padding:6px 14px;border-radius:99px;font-weight:600}
.empty{color:var(--muted);margin:0;padding:12px;border:1.5px dashed var(--line);border-radius:8px}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.split label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;min-height:44px;overflow-wrap:anywhere}
.split input{width:20px;height:20px;accent-color:var(--harbour);flex:none}
.exp{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp b{display:block;overflow-wrap:anywhere}
.exp small{color:var(--muted);display:block;overflow-wrap:anywhere}
.amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--harbour)}
.bal{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bal:first-child{border-top:0}
.pos{color:var(--owed);font-weight:700}.neg{color:var(--owe);font-weight:700}.zero{color:var(--muted);font-weight:600}
.tr{padding:12px;background:var(--tint);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.tr strong:last-child{font-family:Fraunces,serif;font-size:1.2rem;color:var(--harbour)}
.note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Even Keel</h1><p>Log what everyone paid. You'll see who owes whom, so the trip ends level. Owing a friend is normal.</p></div></header>
<main data-testid="app">
<section aria-labelledby="hp">
  <h2 id="hp">People</h2>
  <form id="pf" novalidate>
    <div class="field"><label for="pn">Name</label>
    <div class="row"><div><input id="pn" type="text" data-testid="person-name" autocomplete="off"></div>
    <button type="submit" data-testid="add-person">Add person</button></div></div>
    <p class="err" id="pe" role="alert" hidden data-testid="form-error"></p>
  </form>
  <div id="plist"></div>
</section>

<section aria-labelledby="he">
  <h2 id="he">Add an expense</h2>
  <form id="ef" novalidate>
    <div class="field"><label for="ed">Description</label><input id="ed" type="text" data-testid="expense-desc" autocomplete="off"></div>
    <div class="row">
      <div class="field"><label for="ea">Amount (CAD)</label><input id="ea" type="text" inputmode="decimal" data-testid="expense-amount" placeholder="0.00" autocomplete="off"></div>
      <div class="field"><label for="ep">Paid by</label><select id="ep" data-testid="expense-payer"></select></div>
    </div>
    <fieldset><legend>Split between</legend><div class="split" id="es" data-testid="expense-split"></div></fieldset>
    <p class="err" id="ee" role="alert" hidden data-testid="form-error"></p>
    <button type="submit" data-testid="add-expense">Add expense</button>
  </form>
</section>

<section aria-labelledby="hb">
  <h2 id="hb">Balances</h2>
  <p class="note">Positive means you're owed. Negative means you owe.</p>
  <div id="bals"></div>
</section>

<section aria-labelledby="hs">
  <h2 id="hs">Settle up</h2>
  <div id="trs"></div>
</section>

<section class="full" aria-labelledby="hx">
  <h2 id="hx">Expenses</h2>
  <div id="xs"></div>
</section>
</main>
<script>
const fmt=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
const $=id=>document.getElementById(id);
const KEY='evenkeel.v1';
let S={people:[],expenses:[]};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.people)&&Array.isArray(d.expenses))S=d}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const money=c=>fmt.format(c/100);
function el(t,p,txt){const e=document.createElement(t);if(p)Object.assign(e,p);if(txt!=null)e.textContent=txt;return e}
function showErr(id,m){const e=$(id);e.textContent=m;e.hidden=false}
function clrErr(id){$(id).hidden=true;$(id).textContent=''}

function shares(ex){
  const order=S.people.filter(p=>ex.split.includes(p));
  const n=order.length,base=Math.floor(ex.cents/n),extra=ex.cents-base*n,m={};
  order.forEach((p,i)=>m[p]=base+(i<extra?1:0));
  return m;
}
function balances(){
  const b={};S.people.forEach(p=>b[p]=0);
  S.expenses.forEach(ex=>{
    if(ex.payer in b)b[ex.payer]+=ex.cents;
    const sh=shares(ex);for(const p in sh)b[p]-=sh[p];
  });
  return b;
}
function settle(b){
  const cr=[],db=[];
  S.people.forEach(p=>{if(b[p]>0)cr.push({p,c:b[p]});else if(b[p]<0)db.push({p,c:-b[p]})});
  const out=[];
  while(cr.length&&db.length){
    cr.sort((a,b)=>b.c-a.c);db.sort((a,b)=>b.c-a.c);
    const c=cr[0],d=db[0],x=Math.min(c.c,d.c);
    out.push({from:d.p,to:c.p,cents:x});
    c.c-=x;d.c-=x;
    if(!c.c)cr.shift();if(!d.c)db.shift();
  }
  return out;
}
function render(){
  // people
  const pl=$('plist');pl.textContent='';
  if(!S.people.length)pl.append(el('p',{className:'empty'},'No one is on the trip yet. Add the first name above.'));
  else{const u=el('ul',{className:'chips'});S.people.forEach(p=>{const li=el('li',null,p);li.dataset.testid='person';li.setAttribute('data-testid','person');u.append(li)});pl.append(u)}
  // payer + split (preserve state)
  const prev=$('ep').value;
  const checked=new Set([...document.querySelectorAll('#es input:checked')].map(i=>i.value));
  const known=new Set([...document.querySelectorAll('#es input')].map(i=>i.value));
  $('ep').textContent='';
  S.people.forEach(p=>$('ep').append(el('option',{value:p},p)));
  if(S.people.includes(prev))$('ep').value=prev;
  const es=$('es');es.textContent='';
  if(!S.people.length)es.append(el('p',{className:'empty'},'Add people first to split an expense.'));
  S.people.forEach((p,i)=>{
    const l=el('label');const c=el('input',{type:'checkbox',value:p});
    c.checked=known.has(p)?checked.has(p):true;
    l.append(c,el('span',null,p));es.append(l);
  });
  // expenses
  const xs=$('xs');xs.textContent='';
  if(!S.expenses.length)xs.append(el('p',{className:'empty'},'No expenses yet. Add the first one when someone pays for something.'));
  else{
    const u=el('ul');
    [...S.expenses].reverse().forEach(ex=>{
      const li=el('li',{className:'exp'});li.setAttribute('data-testid','expense');
      const d=el('div');
      d.append(el('b',null,ex.desc),el('small',null,'Paid by '+ex.payer),el('small',null,'Split between '+ex.split.join(', ')));
      const r=el('div');r.style.textAlign='right';
      const a=el('span',{className:'amt'},money(ex.cents));
      const bt=el('button',{type:'button',className:'danger'},'Remove');
      bt.setAttribute('data-testid','delete-expense');
      bt.setAttribute('aria-label','Remove '+ex.desc);
      bt.onclick=()=>{S.expenses=S.expenses.filter(e=>e!==ex&&e.id!==ex.id);save();render()};
      r.append(a,el('br'),bt);li.append(d,r);u.append(li);
    });
    xs.append(u);
  }
  // balances
  const bs=$('bals');bs.textContent='';
  const b=balances();
  if(!S.people.length)bs.append(el('p',{className:'empty'},'Balances appear once people are added.'));
  S.people.forEach(p=>{
    const row=el('div',{className:'bal'});
    row.setAttribute('data-testid','balance');row.dataset.person=p;row.dataset.cents=b[p];
    const v=b[p];
    row.append(el('span',null,p),el('span',{className:v>0?'pos':v<0?'neg':'zero'},v>0?'is owed '+money(v):v<0?'owes '+money(-v):'all even'));
    bs.append(row);
  });
  // transfers
  const ts=$('trs');ts.textContent='';
  const t=settle(b);
  if(!S.expenses.length)ts.append(el('p',{className:'empty'},'Nothing to settle yet. Log an expense and your transfers show up here.'));
  else if(!t.length)ts.append(el('p',{className:'empty'},'Everyone is even. Nothing to pay.'));
  t.forEach(x=>{
    const d=el('div',{className:'tr'});
    d.setAttribute('data-testid','transfer');d.dataset.from=x.from;d.dataset.to=x.to;d.dataset.cents=x.cents;
    const s=el('span');s.append(el('strong',null,x.from),' pays ',el('strong',null,x.to));
    d.append(s,el('strong',null,money(x.cents)));ts.append(d);
  });
}
$('pf').onsubmit=e=>{
  e.preventDefault();
  const n=$('pn').value.trim();
  if(!n)return showErr('pe','Enter a name to add someone.');
  if(S.people.some(p=>p.toLowerCase()===n.toLowerCase()))return showErr('pe',`"${n}" is already on the trip. Names must be different.`);
  S.people.push(n);save();clrErr('pe');$('pn').value='';render();$('pn').focus();
};
$('pn').oninput=()=>clrErr('pe');
$('ef').onsubmit=e=>{
  e.preventDefault();
  const desc=$('ed').value.trim(),raw=$('ea').value.trim().replace(/^\$/,'').replace(/,/g,'');
  const payer=$('ep').value;
  const split=[...document.querySelectorAll('#es input:checked')].map(i=>i.value);
  if(!S.people.length)return showErr('ee','Add at least one person before logging an expense.');
  if(!desc)return showErr('ee','Add a description, like "Groceries".');
  if(!raw)return showErr('ee','Enter an amount.');
  if(!/^\d*\.?\d*$/.test(raw)||raw==='.')return showErr('ee','Amount must be a number, like 42.50.');
  if(!/^\d*(\.\d{1,2})?$/.test(raw))return showErr('ee','Amount can have at most 2 decimal places.');
  const [w,f='']=raw.split('.');
  const cents=parseInt(w||'0',10)*100+parseInt((f+'00').slice(0,2),10);
  if(!(cents>0))return showErr('ee','Amount must be greater than $0.00.');
  if(!payer)return showErr('ee','Choose who paid.');
  if(!split.length)return showErr('ee','Choose at least one person to split between.');
  S.expenses.push({id:Date.now()+Math.random(),desc,cents,payer,split});
  save();clrErr('ee');$('ed').value='';$('ea').value='';render();$('ed').focus();
};
['ed','ea','ep'].forEach(i=>$(i).addEventListener('input',()=>clrErr('ee')));
$('es').addEventListener('change',()=>clrErr('ee'));
render();
</script>
</body>
</html>
