<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Even Keel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F3EC;color:#1F3A4D;font:400 16px/1.5 'IBM Plex Sans',sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 48px}
@media(min-width:600px){main{padding-left:24px;padding-right:24px}}
h1,h2{font-family:Fraunces,serif;font-weight:600;margin:0}
h1{font-size:28px;display:flex;align-items:center;gap:8px}
h1:before{content:"";width:24px;height:3px;background:#C2462B;display:block}
h2{font-size:20px;margin-bottom:16px}
.sub{color:#5B6B75;font-size:14px;margin:4px 0 24px}
section{background:#fff;border:1px solid #D9D2C3;border-radius:6px;padding:16px;margin-bottom:24px}
label,legend{display:block;font-weight:500;font-size:14px;margin-bottom:4px;padding:0}
input[type=text],input[type=number],select{width:100%;font:inherit;padding:8px;border:1px solid #D9D2C3;border-radius:6px;background:#fff;color:#1F3A4D;min-height:40px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
.field{margin-bottom:16px}
button{font:500 16px 'IBM Plex Sans',sans-serif;border-radius:6px;padding:8px 16px;min-height:40px;cursor:pointer;border:1px solid #D9D2C3;background:#fff;color:#1F3A4D}
button.primary{background:#C2462B;border-color:#C2462B;color:#fff}
button.primary:hover{background:#A93A22}
button:hover{border-color:#1F3A4D}
:focus-visible{outline:2px solid #1F3A4D;outline-offset:2px}
fieldset{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:8px;font-weight:400;font-size:16px;margin:0}
.err{color:#1F3A4D;font-size:14px;font-weight:500;margin:8px 0 0;border-left:3px solid #1F3A4D;padding-left:8px}
.err:empty{display:none}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #D9D2C3;flex-wrap:wrap}
li:first-child{border-top:0}
.meta{color:#5B6B75;font-size:14px}
.m{font-variant-numeric:tabular-nums;font-weight:500}
.pos{color:#2F6B4F}
.empty{color:#5B6B75;margin:0}
h3{font-size:16px;margin:24px 0 8px;font-weight:500}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<main data-testid="app">
<h1>Even Keel</h1>
<p class="sub">Split trip costs so everyone ends up even.</p>

<section aria-labelledby="hp">
<h2 id="hp">People</h2>
<form id="pf" novalidate>
<div class="row"><div><label for="pn">Name</label><input type="text" id="pn" data-testid="person-name" autocomplete="off"></div>
<button type="submit" class="primary" data-testid="add-person">Add person</button></div>
<p class="err" id="pe" role="alert"></p>
</form>
<ul id="pl" style="margin-top:16px"></ul>
</section>

<section aria-labelledby="he">
<h2 id="he">Expenses</h2>
<form id="ef" novalidate>
<div class="field"><label for="ed">Description</label><input type="text" id="ed" data-testid="expense-desc" autocomplete="off"></div>
<div class="row field"><div><label for="ea">Amount (CAD)</label><input type="text" inputmode="decimal" id="ea" data-testid="expense-amount" autocomplete="off"></div>
<div><label for="ep">Paid by</label><select id="ep" data-testid="expense-payer"></select></div></div>
<fieldset class="field"><legend>Split between</legend><div class="checks" id="es" data-testid="expense-split"></div></fieldset>
<button type="submit" class="primary" data-testid="add-expense">Add expense</button>
<p class="err" id="ee" role="alert"></p>
</form>
<ul id="el" style="margin-top:16px"></ul>
</section>

<section aria-labelledby="hb">
<h2 id="hb">Balances</h2>
<ul id="bl"></ul>
<h3>Settle up</h3>
<ul id="tl"></ul>
</section>
</main>
<script>
const fmt=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
const $=id=>document.getElementById(id);
let S={people:[],expenses:[]};
try{const x=JSON.parse(localStorage.getItem('evenkeel'));if(x&&Array.isArray(x.people)&&Array.isArray(x.expenses))S=x}catch(e){}
const save=()=>localStorage.setItem('evenkeel',JSON.stringify(S));
const money=c=>(c<0?'−':'')+fmt.format(Math.abs(c)/100);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function setErr(id,m){const e=$(id);e.textContent=m;if(m)e.setAttribute('data-testid','form-error');else e.removeAttribute('data-testid')}
function shares(ex){
 const order=S.people.filter(p=>ex.split.includes(p));
 const n=order.length,base=Math.floor(ex.cents/n),r=ex.cents-base*n,o={};
 order.forEach((p,i)=>o[p]=base+(i<r?1:0));return o}
function balances(){
 const b={};S.people.forEach(p=>b[p]=0);
 S.expenses.forEach(ex=>{b[ex.payer]=(b[ex.payer]||0)+ex.cents;const s=shares(ex);for(const p in s)b[p]-=s[p]});
 return b}
function transfers(b){
 const cr=[],de=[];
 S.people.forEach(p=>{if(b[p]>0)cr.push([p,b[p]]);else if(b[p]<0)de.push([p,-b[p]])});
 const t=[];cr.sort((a,b)=>b[1]-a[1]);de.sort((a,b)=>b[1]-a[1]);
 let i=0,j=0;
 while(i<cr.length&&j<de.length){const m=Math.min(cr[i][1],de[j][1]);
  t.push({from:de[j][0],to:cr[i][0],c:m});cr[i][1]-=m;de[j][1]-=m;
  if(!cr[i][1])i++;if(!de[j][1])j++}
 return t}
function render(){
 const pl=$('pl');
 pl.innerHTML=S.people.length?S.people.map(p=>`<li data-testid="person">${esc(p)}</li>`).join(''):'<li><p class="empty">Add the first person on your trip.</p></li>';
 const keep=$('ep').value;
 $('ep').innerHTML=S.people.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
 if(S.people.includes(keep))$('ep').value=keep;
 const chk=new Set([...document.querySelectorAll('#es input:checked')].map(i=>i.value));
 const had=new Set([...document.querySelectorAll('#es input')].map(i=>i.value));
 $('es').innerHTML=S.people.length?S.people.map(p=>`<label><input type="checkbox" value="${esc(p)}" ${(!had.has(p)||chk.has(p))?'checked':''}>${esc(p)}</label>`).join(''):'<span class="meta">Add people to choose who shares the cost.</span>';
 const el=$('el');
 el.innerHTML=S.expenses.length?[...S.expenses].reverse().map(ex=>`<li data-testid="expense"><div class="grow"><div><strong style="font-weight:500">${esc(ex.desc)}</strong> · <span class="m">${money(ex.cents)}</span></div><div class="meta">Paid by ${esc(ex.payer)}. Split between ${ex.split.map(esc).join(', ')}.</div></div><button type="button" data-testid="delete-expense" data-id="${ex.id}" aria-label="Remove ${esc(ex.desc)}">Remove</button></li>`).join(''):'<li><p class="empty">'+(S.people.length?'Log the first expense when someone pays for something.':'Add people first, then log what you spend.')+'</p></li>';
 const b=balances();
 $('bl').innerHTML=S.people.length?S.people.map(p=>{const c=b[p];return `<li data-testid="balance" data-person="${esc(p)}" data-cents="${c}"><span>${esc(p)}</span><span class="m ${c>0?'pos':''}">${c>0?'is owed ':c<0?'owes ':'even '}${c?money(Math.abs(c)):''}${c<0?' ('+money(c)+')':''}</span></li>`}).join(''):'<li><p class="empty">Balances appear once you add people.</p></li>';
 const t=transfers(b);
 $('tl').innerHTML=t.length?t.map(x=>`<li data-testid="transfer" data-from="${esc(x.from)}" data-to="${esc(x.to)}" data-cents="${x.c}"><span>${esc(x.from)} pays ${esc(x.to)}</span><span class="m">${money(x.c)}</span></li>`).join(''):'<li><p class="empty">'+(S.expenses.length?'Everyone is even.':'Nothing to settle yet.')+'</p></li>';
}
$('pf').addEventListener('submit',e=>{
 e.preventDefault();const n=$('pn').value.trim();
 if(!n)return setErr('pe','Enter a name.');
 if(S.people.some(p=>p.toLowerCase()===n.toLowerCase()))return setErr('pe',n+' is already on the trip. Use a different name.');
 S.people.push(n);save();setErr('pe','');$('pn').value='';render()});
$('ef').addEventListener('submit',e=>{
 e.preventDefault();
 const desc=$('ed').value.trim(),a=$('ea').value.trim(),payer=$('ep').value;
 const split=[...document.querySelectorAll('#es input:checked')].map(i=>i.value);
 if(!desc)return setErr('ee','Enter a description.');
 if(!/^\d*\.?\d+$|^\d+\.$/.test(a)||!(parseFloat(a)>0))return setErr('ee','Enter an amount greater than $0.');
 if(!/^\d*(\.\d{0,2})?$/.test(a))return setErr('ee','Use at most 2 decimal places in the amount.');
 if(!payer)return setErr('ee','Add a person to choose who paid.');
 if(!split.length)return setErr('ee','Choose at least one person to split between.');
 const [w,f='']=a.split('.');const cents=parseInt(w||'0',10)*100+parseInt((f+'00').slice(0,2),10);
 if(cents<1)return setErr('ee','Enter an amount greater than $0.');
 S.expenses.push({id:Date.now()+Math.random(),desc,cents,payer,split});
 save();setErr('ee','');$('ed').value='';$('ea').value='';render()});
$('el').addEventListener('click',e=>{
 const b=e.target.closest('[data-id]');if(!b)return;
 S.expenses=S.expenses.filter(x=>String(x.id)!==b.dataset.id);save();render()});
render();
</script>
</body>
</html>
