<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Even Keel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --harbour:#1F3A4D; --fog:#5B6B75; --sailcloth:#F6F3EC; --paper:#FFFFFF;
    --rope:#D9D2C3; --signal:#C2462B; --kelp:#2F6B4F;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--sailcloth); color:var(--harbour);
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:16px; line-height:1.5;
  }
  main{max-width:720px;margin:0 auto;padding:32px 16px 48px}
  @media (min-width:600px){ main{padding:48px 24px 64px} }
  header{margin-bottom:32px}
  .wordmark{display:flex;align-items:center;gap:12px;margin:0;font-family:Fraunces,serif;font-weight:600;font-size:28px;line-height:1.2}
  .wordmark::before{content:"";display:block;width:24px;height:3px;background:var(--signal);flex:none}
  .tagline{margin:4px 0 0 36px;color:var(--fog);font-size:16px}
  h2{font-family:Fraunces,serif;font-weight:600;font-size:20px;line-height:1.3;margin:0 0 16px}
  section{background:var(--paper);border:1px solid var(--rope);border-radius:6px;padding:16px;margin-bottom:24px}
  @media (min-width:600px){ section{padding:24px} }
  label{display:block;font-weight:500;font-size:14px;margin-bottom:4px}
  .hint{color:var(--fog);font-size:14px;margin:4px 0 0}
  input[type=text],input[type=number],select{
    width:100%;font:inherit;color:var(--harbour);background:var(--paper);
    border:1px solid var(--rope);border-radius:6px;padding:8px 12px;min-height:44px;
    transition:border-color 150ms;
  }
  input[type=text]:hover,select:hover{border-color:var(--harbour)}
  :focus-visible{outline:2px solid var(--harbour);outline-offset:2px}
  button{font:inherit;font-weight:500;font-size:16px;border-radius:6px;padding:8px 16px;min-height:44px;cursor:pointer;transition:background-color 150ms,color 150ms,border-color 150ms}
  .primary{background:var(--signal);color:var(--paper);border:1px solid var(--signal)}
  .primary:hover{background:var(--harbour);border-color:var(--harbour)}
  .secondary{background:var(--paper);color:var(--harbour);border:1px solid var(--rope)}
  .secondary:hover{border-color:var(--harbour)}
  .row{display:flex;flex-direction:column;gap:8px}
  @media (min-width:600px){
    .row{flex-direction:row;align-items:flex-end}
    .row .grow{flex:1}
    .row button{flex:none}
  }
  .field{margin-bottom:16px}
  .error{color:var(--harbour);font-size:14px;margin:8px 0 0;font-weight:500}
  ul{list-style:none;margin:0;padding:0}
  .list li{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid var(--rope)}
  .list li:first-child{border-top:0}
  .people li{padding:8px 0}
  .empty{color:var(--fog);margin:0}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;border:1px solid var(--rope);border-radius:6px;padding:12px}
  .checks label{display:flex;align-items:center;gap:8px;font-weight:400;font-size:16px;margin:0;min-height:24px;cursor:pointer}
  .checks input{width:18px;height:18px;margin:0;accent-color:var(--harbour);flex:none}
  .money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
  .owed{color:var(--kelp)}
  .meta{color:var(--fog);font-size:14px;margin:4px 0 0;word-break:break-word}
  .desc{font-weight:500;word-break:break-word}
  .exp-main{flex:1;min-width:0}
  .exp-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .exp-side button{min-height:36px;padding:4px 12px;font-size:14px}
  .transfer{flex-wrap:wrap}
  fieldset{border:0;padding:0;margin:0 0 16px}
  legend{font-weight:500;font-size:14px;margin-bottom:4px;padding:0}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main data-testid="app">
  <header>
    <h1 class="wordmark">Even Keel</h1>
    <p class="tagline">Split trip costs so everyone ends up even.</p>
  </header>

  <section aria-labelledby="people-h">
    <h2 id="people-h">People</h2>
    <form id="person-form" novalidate>
      <div class="row">
        <div class="grow">
          <label for="person-name">Name</label>
          <input type="text" id="person-name" data-testid="person-name" autocomplete="off">
        </div>
        <button type="submit" class="primary" data-testid="add-person">Add person</button>
      </div>
      <div id="person-error"></div>
    </form>
    <div id="people-list" style="margin-top:16px"></div>
  </section>

  <section aria-labelledby="expense-h">
    <h2 id="expense-h">Expenses</h2>
    <form id="expense-form" novalidate>
      <div class="field">
        <label for="expense-desc">Description</label>
        <input type="text" id="expense-desc" data-testid="expense-desc" autocomplete="off">
      </div>
      <div class="field">
        <label for="expense-amount">Amount (CAD)</label>
        <input type="text" id="expense-amount" data-testid="expense-amount" inputmode="decimal" autocomplete="off">
        <p class="hint">Dollars and cents, for example 42.50.</p>
      </div>
      <div class="field">
        <label for="expense-payer">Paid by</label>
        <select id="expense-payer" data-testid="expense-payer"></select>
      </div>
      <fieldset>
        <legend>Split between</legend>
        <div id="expense-split" class="checks" data-testid="expense-split"></div>
      </fieldset>
      <button type="submit" class="primary" data-testid="add-expense">Add expense</button>
      <div id="expense-error"></div>
    </form>
    <div id="expense-list" style="margin-top:24px"></div>
  </section>

  <section aria-labelledby="balance-h">
    <h2 id="balance-h">Balances</h2>
    <div id="balance-list"></div>
  </section>

  <section aria-labelledby="settle-h">
    <h2 id="settle-h">Settle up</h2>
    <div id="settle-list"></div>
  </section>
</main>

<script>
(function(){
  const STORE_KEY='even-keel-v1';
  const fmt=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
  const money=c=>fmt.format(c/100);

  let state={people:[],expenses:[]};
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const p=JSON.parse(raw); if(p&&Array.isArray(p.people)&&Array.isArray(p.expenses)) state=p;}
  }catch(e){}
  const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}};

  const $=id=>document.getElementById(id);
  const el=(tag,attrs,...kids)=>{
    const n=document.createElement(tag);
    for(const k in attrs||{}){ if(k==='text') n.textContent=attrs[k]; else n.setAttribute(k,attrs[k]); }
    kids.forEach(k=>n.appendChild(typeof k==='string'?document.createTextNode(k):k));
    return n;
  };

  function setError(container,msg){
    container.textContent='';
    if(msg){
      container.appendChild(el('p',{class:'error','data-testid':'form-error',role:'alert',text:msg}));
    }
  }

  function shares(exp){
    const sel=state.people.filter(p=>exp.split.includes(p));
    const k=sel.length, out={};
    if(!k) return out;
    const base=Math.floor(exp.cents/k), rem=exp.cents%k;
    sel.forEach((p,i)=>{out[p]=base+(i<rem?1:0)});
    return out;
  }

  function balances(){
    const b={}; state.people.forEach(p=>b[p]=0);
    state.expenses.forEach(e=>{
      if(e.payer in b) b[e.payer]+=e.cents;
      const s=shares(e); for(const p in s) b[p]-=s[p];
    });
    return b;
  }

  function settle(b){
    const debt=[],cred=[];
    state.people.forEach(p=>{ if(b[p]<0) debt.push({p,c:-b[p]}); else if(b[p]>0) cred.push({p,c:b[p]}); });
    debt.sort((a,b)=>b.c-a.c); cred.sort((a,b)=>b.c-a.c);
    const out=[]; let i=0,j=0;
    while(i<debt.length&&j<cred.length){
      const amt=Math.min(debt[i].c,cred[j].c);
      if(amt>0) out.push({from:debt[i].p,to:cred[j].p,cents:amt});
      debt[i].c-=amt; cred[j].c-=amt;
      if(debt[i].c===0) i++; if(cred[j].c===0) j++;
    }
    return out;
  }

  function renderPeople(){
    const c=$('people-list'); c.textContent='';
    if(!state.people.length){ c.appendChild(el('p',{class:'empty',text:'Add the first person on your trip to get started.'})); return; }
    const ul=el('ul',{class:'list people'});
    state.people.forEach(p=>ul.appendChild(el('li',{'data-testid':'person',text:p})));
    c.appendChild(ul);
  }

  function renderForm(resetSplit){
    const sel=$('expense-payer'); const prev=sel.value; sel.textContent='';
    if(!state.people.length){ sel.appendChild(el('option',{value:'',text:'Add a person first'})); sel.disabled=true; }
    else{
      sel.disabled=false;
      state.people.forEach(p=>sel.appendChild(el('option',{value:p,text:p})));
      if(state.people.includes(prev)) sel.value=prev;
    }
    const split=$('expense-split');
    const prevChecked={};
    if(!resetSplit) split.querySelectorAll('input').forEach(i=>prevChecked[i.value]=i.checked);
    split.textContent='';
    if(!state.people.length){ split.appendChild(el('p',{class:'empty',text:'Add a person before logging an expense.'})); return; }
    state.people.forEach((p,i)=>{
      const id='split-'+i;
      const input=el('input',{type:'checkbox',id,value:p});
      input.checked=(p in prevChecked)?prevChecked[p]:true;
      split.appendChild(el('label',{for:id},input,el('span',{text:p})));
    });
  }

  function renderExpenses(){
    const c=$('expense-list'); c.textContent='';
    if(!state.expenses.length){ c.appendChild(el('p',{class:'empty',text:'Log the first thing someone paid for and it will appear here.'})); return; }
    const ul=el('ul',{class:'list'});
    [...state.expenses].reverse().forEach(e=>{
      const main=el('div',{class:'exp-main'},
        el('div',{class:'desc',text:e.desc}),
        el('p',{class:'meta',text:'Paid by '+e.payer}),
        el('p',{class:'meta',text:'Split between '+state.people.filter(p=>e.split.includes(p)).join(', ')})
      );
      const btn=el('button',{type:'button',class:'secondary','data-testid':'delete-expense','aria-label':'Remove '+e.desc,text:'Remove'});
      btn.addEventListener('click',()=>{ state.expenses=state.expenses.filter(x=>x.id!==e.id); save(); renderAll(); });
      const side=el('div',{class:'exp-side'},el('span',{class:'money',text:money(e.cents)}),btn);
      ul.appendChild(el('li',{'data-testid':'expense'},main,side));
    });
    c.appendChild(ul);
  }

  function renderBalances(){
    const c=$('balance-list'); c.textContent='';
    if(!state.people.length){ c.appendChild(el('p',{class:'empty',text:'Balances appear once you add people and expenses.'})); return; }
    const b=balances(); const ul=el('ul',{class:'list'});
    state.people.forEach(p=>{
      const v=b[p];
      const amt=el('span',{class:'money'+(v>0?' owed':''),text:v<0?'-'+money(-v):money(v)});
      const label=v>0?'is owed':v<0?'owes':'is even';
      ul.appendChild(el('li',{'data-testid':'balance','data-person':p,'data-cents':String(v)},
        el('div',{},el('span',{class:'desc',text:p}),el('p',{class:'meta',text:label})),amt));
    });
    c.appendChild(ul);
  }

  function renderSettle(){
    const c=$('settle-list'); c.textContent='';
    if(!state.expenses.length){ c.appendChild(el('p',{class:'empty',text:'Add an expense to see who should pay whom.'})); return; }
    const t=settle(balances());
    if(!t.length){ c.appendChild(el('p',{class:'empty',text:'Everyone is even. Nothing to settle.'})); return; }
    const ul=el('ul',{class:'list'});
    t.forEach(x=>ul.appendChild(el('li',{class:'transfer','data-testid':'transfer','data-from':x.from,'data-to':x.to,'data-cents':String(x.cents)},
      el('span',{},el('span',{class:'desc',text:x.from}),' pays ',el('span',{class:'desc',text:x.to})),
      el('span',{class:'money',text:money(x.cents)}))));
    c.appendChild(ul);
  }

  function renderAll(resetSplit){ renderPeople(); renderForm(resetSplit); renderExpenses(); renderBalances(); renderSettle(); }

  $('person-form').addEventListener('submit',e=>{
    e.preventDefault();
    const input=$('person-name'); const name=input.value.trim(); const err=$('person-error');
    if(!name){ setError(err,'Enter a name.'); input.focus(); return; }
    if(state.people.some(p=>p.toLowerCase()===name.toLowerCase())){ setError(err,name+' is already on the trip. Use a different name.'); input.focus(); return; }
    setError(err,''); state.people.push(name); save(); input.value=''; renderAll(false); input.focus();
  });

  function parseCents(str){
    let s=str.trim().replace(/^\$/,'').replace(/,/g,'');
    if(!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    const [d,c='']=s.split('.');
    return parseInt(d,10)*100+parseInt((c+'00').slice(0,2),10);
  }

  $('expense-form').addEventListener('submit',e=>{
    e.preventDefault();
    const err=$('expense-error');
    const desc=$('expense-desc').value.trim();
    const amtStr=$('expense-amount').value;
    const payer=$('expense-payer').value;
    const split=[...$('expense-split').querySelectorAll('input:checked')].map(i=>i.value);
    if(!state.people.length){ setError(err,'Add at least one person before adding an expense.'); return; }
    if(!desc){ setError(err,'Enter a description.'); $('expense-desc').focus(); return; }
    const t=amtStr.trim().replace(/^\$/,'').replace(/,/g,'');
    if(/^\d+\.\d{3,}$/.test(t)){ setError(err,'Use at most 2 decimal places for the amount.'); $('expense-amount').focus(); return; }
    const cents=parseCents(amtStr);
    if(cents===null||cents<=0){ setError(err,'Enter an amount greater than $0.'); $('expense-amount').focus(); return; }
    if(!state.people.includes(payer)){ setError(err,'Choose who paid.'); $('expense-payer').focus(); return; }
    if(!split.length){ setError(err,'Select at least one person to split between.'); const f=$('expense-split').querySelector('input'); if(f) f.focus(); return; }
    setError(err,'');
    state.expenses.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),desc,cents,payer,split});
    save();
    $('expense-desc').value=''; $('expense-amount').value='';
    renderAll(true); $('expense-desc').focus();
  });

  renderAll(true);
})();
</script>
</body>
</html>
