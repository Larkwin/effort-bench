<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Even Keel – split trip expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --harbour: #1F3A4D;
    --fog: #5B6B75;
    --sailcloth: #F6F3EC;
    --paper: #FFFFFF;
    --rope: #D9D2C3;
    --signal: #C2462B;
    --kelp: #2F6B4F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--sailcloth);
    color: var(--harbour);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }
  @media (min-width: 600px) {
    main { padding: 48px 24px 80px; }
  }
  header { margin-bottom: 32px; }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.1;
    color: var(--harbour);
  }
  .wordmark::before {
    content: "";
    display: block;
    width: 24px;
    height: 3px;
    background: var(--signal);
    flex: none;
  }
  .tagline { margin: 8px 0 0 36px; color: var(--fog); font-size: 16px; }
  h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.2;
    margin: 0 0 16px;
  }
  h3 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    margin: 24px 0 8px;
  }
  section { margin-bottom: 40px; }
  .panel {
    background: var(--paper);
    border: 1px solid var(--rope);
    border-radius: 6px;
    padding: 16px;
  }
  @media (min-width: 600px) { .panel { padding: 24px; } }
  label, legend { display: block; font-weight: 500; font-size: 14px; margin-bottom: 4px; }
  .field { margin-bottom: 16px; }
  input[type="text"], select {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--harbour);
    background: var(--paper);
    border: 1px solid var(--rope);
    border-radius: 6px;
    padding: 8px 12px;
    margin: 0;
  }
  input[type="text"]:hover, select:hover { border-color: var(--harbour); transition: border-color 150ms; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .row .field { flex: 1 1 200px; margin-bottom: 0; }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background-color 150ms, border-color 150ms;
    border: 1px solid transparent;
  }
  .primary { background: var(--signal); color: var(--paper); border-color: var(--signal); }
  .primary:hover { background: var(--harbour); border-color: var(--harbour); }
  .secondary { background: var(--paper); color: var(--harbour); border-color: var(--rope); font-size: 14px; padding: 4px 12px; }
  .secondary:hover { border-color: var(--harbour); }
  :focus-visible { outline: 2px solid var(--harbour); outline-offset: 2px; }
  .error { margin: 8px 0 0; font-weight: 500; font-size: 14px; color: var(--harbour); }
  .hint { color: var(--fog); font-size: 14px; margin: 4px 0 0; }
  .empty { color: var(--fog); margin: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  .list li {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 12px 0;
    border-top: 1px solid var(--rope);
  }
  .list li:first-child { border-top: 0; padding-top: 0; }
  .list li:last-child { padding-bottom: 0; }
  .meta { color: var(--fog); font-size: 14px; margin: 4px 0 0; overflow-wrap: anywhere; }
  .money { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
  .owed { color: var(--kelp); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .chips label { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 16px; margin: 0; }
  input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: var(--harbour); }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .actions { margin-top: 16px; }
</style>
</head>
<body>
<main data-testid="app">
  <header>
    <h1 class="wordmark">Even Keel</h1>
    <p class="tagline">Split trip costs so everyone ends up even.</p>
  </header>

  <section aria-labelledby="people-heading">
    <h2 id="people-heading">People</h2>
    <div class="panel">
      <form id="person-form" novalidate>
        <div class="row">
          <div class="field">
            <label for="person-name">Name</label>
            <input type="text" id="person-name" data-testid="person-name" autocomplete="off">
          </div>
          <button type="submit" class="primary" data-testid="add-person">Add person</button>
        </div>
        <div id="person-error" aria-live="polite"></div>
      </form>
      <h3>On the trip</h3>
      <div id="people-list"></div>
    </div>
  </section>

  <section aria-labelledby="expenses-heading">
    <h2 id="expenses-heading">Expenses</h2>
    <div class="panel">
      <form id="expense-form" novalidate>
        <div class="field">
          <label for="expense-desc">Description</label>
          <input type="text" id="expense-desc" data-testid="expense-desc" autocomplete="off">
        </div>
        <div class="field">
          <label for="expense-amount">Amount (CAD)</label>
          <input type="text" id="expense-amount" data-testid="expense-amount" inputmode="decimal" autocomplete="off">
          <p class="hint">Dollars and cents, for example 42.50.</p>
        </div>
        <div class="field">
          <label for="expense-payer">Paid by</label>
          <select id="expense-payer" data-testid="expense-payer"></select>
        </div>
        <fieldset class="field">
          <legend>Split between</legend>
          <div id="expense-split" class="chips" data-testid="expense-split"></div>
        </fieldset>
        <div id="expense-error" aria-live="polite"></div>
        <div class="actions">
          <button type="submit" class="primary" data-testid="add-expense">Add expense</button>
        </div>
      </form>
      <h3>Logged so far</h3>
      <div id="expense-list"></div>
    </div>
  </section>

  <section aria-labelledby="balances-heading">
    <h2 id="balances-heading">Balances</h2>
    <div class="panel">
      <div id="balance-list"></div>
      <h3>Settle up</h3>
      <div id="transfer-list"></div>
    </div>
  </section>
</main>

<script>
(function () {
  var STORAGE_KEY = 'even-keel-trip';
  var fmt = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.people) && Array.isArray(s.expenses)) return s;
      }
    } catch (e) {}
    return { people: [], expenses: [] };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'className') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function money(cents) { return fmt.format(cents / 100); }
  function signedMoney(cents) {
    return cents < 0 ? '\u2212' + money(-cents) : money(cents);
  }
  function listNames(names) {
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + ' and ' + names[1];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }

  function showError(container, msg) {
    container.innerHTML = '';
    if (msg) container.appendChild(el('p', { className: 'error', 'data-testid': 'form-error', role: 'alert', text: msg }));
  }

  // Shares in integer cents, leftover cents to people in trip order.
  function shares(expense) {
    var order = state.people.filter(function (p) { return expense.split.indexOf(p) !== -1; });
    var n = order.length;
    var base = Math.floor(expense.cents / n);
    var extra = expense.cents - base * n;
    var out = {};
    order.forEach(function (p, i) { out[p] = base + (i < extra ? 1 : 0); });
    return out;
  }

  function balances() {
    var b = {};
    state.people.forEach(function (p) { b[p] = 0; });
    state.expenses.forEach(function (e) {
      b[e.payer] += e.cents;
      var s = shares(e);
      Object.keys(s).forEach(function (p) { b[p] -= s[p]; });
    });
    return b;
  }

  function transfers(b) {
    var creditors = [], debtors = [];
    state.people.forEach(function (p) {
      if (b[p] > 0) creditors.push({ name: p, cents: b[p] });
      else if (b[p] < 0) debtors.push({ name: p, cents: -b[p] });
    });
    creditors.sort(function (x, y) { return y.cents - x.cents; });
    debtors.sort(function (x, y) { return y.cents - x.cents; });
    var out = [], i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      var amt = Math.min(debtors[i].cents, creditors[j].cents);
      out.push({ from: debtors[i].name, to: creditors[j].name, cents: amt });
      debtors[i].cents -= amt;
      creditors[j].cents -= amt;
      if (debtors[i].cents === 0) i++;
      if (creditors[j].cents === 0) j++;
    }
    return out;
  }

  // Rendering
  function renderPeople() {
    var c = document.getElementById('people-list');
    c.innerHTML = '';
    if (!state.people.length) {
      c.appendChild(el('p', { className: 'empty', text: 'Add everyone on the trip to get started.' }));
      return;
    }
    var ul = el('ul', { className: 'list' });
    state.people.forEach(function (p) {
      ul.appendChild(el('li', { 'data-testid': 'person' }, [el('span', { className: 'title', text: p })]));
    });
    c.appendChild(ul);
  }

  function renderExpenseForm() {
    var sel = document.getElementById('expense-payer');
    var prev = sel.value;
    sel.innerHTML = '';
    if (!state.people.length) {
      sel.appendChild(el('option', { value: '', text: 'Add a person first' }));
      sel.disabled = true;
    } else {
      sel.disabled = false;
      state.people.forEach(function (p) { sel.appendChild(el('option', { value: p, text: p })); });
      if (state.people.indexOf(prev) !== -1) sel.value = prev;
    }
    var split = document.getElementById('expense-split');
    var checked = {};
    Array.prototype.forEach.call(split.querySelectorAll('input'), function (i) { checked[i.value] = i.checked; });
    split.innerHTML = '';
    if (!state.people.length) {
      split.appendChild(el('p', { className: 'empty', text: 'Add a person to choose who shares this expense.' }));
      return;
    }
    state.people.forEach(function (p, idx) {
      var id = 'split-' + idx;
      var box = el('input', { type: 'checkbox', id: id, value: p });
      box.checked = (p in checked) ? checked[p] : true;
      split.appendChild(el('label', { for: id }, [box, el('span', { text: p })]));
    });
  }

  function renderExpenses() {
    var c = document.getElementById('expense-list');
    c.innerHTML = '';
    if (!state.expenses.length) {
      c.appendChild(el('p', { className: 'empty', text: state.people.length ? 'Log the first thing someone paid for.' : 'Add people, then log what they paid for.' }));
      return;
    }
    var ul = el('ul', { className: 'list' });
    state.expenses.slice().reverse().forEach(function (e) {
      var order = state.people.filter(function (p) { return e.split.indexOf(p) !== -1; });
      var left = el('div', {}, [
        el('div', { className: 'title' }, [
          el('span', { text: e.desc + ' ' }),
          el('span', { className: 'money', text: money(e.cents) })
        ]),
        el('p', { className: 'meta', text: 'Paid by ' + e.payer + ', split between ' + listNames(order) })
      ]);
      var btn = el('button', { type: 'button', className: 'secondary', 'data-testid': 'delete-expense', 'aria-label': 'Remove ' + e.desc, text: 'Remove' });
      btn.addEventListener('click', function () {
        state.expenses = state.expenses.filter(function (x) { return x.id !== e.id; });
        save(); render();
      });
      ul.appendChild(el('li', { 'data-testid': 'expense' }, [left, btn]));
    });
    c.appendChild(ul);
  }

  function renderBalances() {
    var bc = document.getElementById('balance-list');
    var tc = document.getElementById('transfer-list');
    bc.innerHTML = ''; tc.innerHTML = '';
    if (!state.people.length) {
      bc.appendChild(el('p', { className: 'empty', text: 'Balances appear once you add people and expenses.' }));
      tc.appendChild(el('p', { className: 'empty', text: 'Transfers appear once someone owes money.' }));
      return;
    }
    var b = balances();
    var ul = el('ul', { className: 'list' });
    state.people.forEach(function (p) {
      var cents = b[p];
      var label = cents > 0 ? 'is owed' : cents < 0 ? 'owes' : 'is even';
      ul.appendChild(el('li', { 'data-testid': 'balance', 'data-person': p, 'data-cents': String(cents) }, [
        el('div', {}, [el('span', { className: 'title', text: p }), el('p', { className: 'meta', text: label })]),
        el('span', { className: 'money' + (cents > 0 ? ' owed' : ''), text: signedMoney(cents) })
      ]));
    });
    bc.appendChild(ul);
    var t = transfers(b);
    if (!t.length) {
      tc.appendChild(el('p', { className: 'empty', text: state.expenses.length ? 'Everyone is even. Nothing to settle.' : 'Log an expense to see who should pay whom.' }));
      return;
    }
    var tul = el('ul', { className: 'list' });
    t.forEach(function (x) {
      tul.appendChild(el('li', { 'data-testid': 'transfer', 'data-from': x.from, 'data-to': x.to, 'data-cents': String(x.cents) }, [
        el('span', { className: 'title', text: x.from + ' pays ' + x.to }),
        el('span', { className: 'money', text: money(x.cents) })
      ]));
    });
    tc.appendChild(tul);
  }

  function render() {
    renderPeople();
    renderExpenseForm();
    renderExpenses();
    renderBalances();
  }

  // Person form
  document.getElementById('person-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var input = document.getElementById('person-name');
    var errBox = document.getElementById('person-error');
    var name = input.value.trim();
    if (!name) { showError(errBox, 'Enter a name.'); input.focus(); return; }
    var dup = state.people.some(function (p) { return p.toLowerCase() === name.toLowerCase(); });
    if (dup) { showError(errBox, 'Someone named ' + name + ' is already on the trip. Use a different name.'); input.focus(); return; }
    state.people.push(name);
    save();
    showError(errBox, '');
    input.value = '';
    render();
    input.focus();
  });

  function parseCents(str) {
    var s = str.trim().replace(/^\$/, '').replace(/,/g, '');
    if (!/^\d+(\.\d*)?$/.test(s) && !/^\.\d+$/.test(s)) return { error: 'Enter an amount greater than $0.' };
    var parts = s.split('.');
    var whole = parts[0] || '0';
    var frac = parts[1] || '';
    if (frac.length > 2) return { error: 'Enter an amount with at most 2 decimal places.' };
    var cents = parseInt(whole, 10) * 100 + parseInt((frac + '00').slice(0, 2), 10);
    if (!(cents > 0)) return { error: 'Enter an amount greater than $0.' };
    return { cents: cents };
  }

  // Expense form
  document.getElementById('expense-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var errBox = document.getElementById('expense-error');
    var descIn = document.getElementById('expense-desc');
    var amtIn = document.getElementById('expense-amount');
    var sel = document.getElementById('expense-payer');
    if (!state.people.length) { showError(errBox, 'Add at least one person before logging an expense.'); return; }
    var desc = descIn.value.trim();
    if (!desc) { showError(errBox, 'Enter a description.'); descIn.focus(); return; }
    var parsed = parseCents(amtIn.value);
    if (parsed.error) { showError(errBox, parsed.error); amtIn.focus(); return; }
    var payer = sel.value;
    if (state.people.indexOf(payer) === -1) { showError(errBox, 'Choose who paid.'); sel.focus(); return; }
    var split = [];
    Array.prototype.forEach.call(document.querySelectorAll('#expense-split input:checked'), function (i) { split.push(i.value); });
    if (!split.length) {
      showError(errBox, 'Choose at least one person to split between.');
      var first = document.querySelector('#expense-split input');
      if (first) first.focus();
      return;
    }
    state.expenses.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2), desc: desc, cents: parsed.cents, payer: payer, split: split });
    save();
    showError(errBox, '');
    descIn.value = '';
    amtIn.value = '';
    Array.prototype.forEach.call(document.querySelectorAll('#expense-split input'), function (i) { i.checked = true; });
    render();
    descIn.focus();
  });

  render();
})();
</script>
</body>
</html>
