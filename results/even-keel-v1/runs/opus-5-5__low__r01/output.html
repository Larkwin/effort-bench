<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Even Keel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F6F3EC;color:#1F3A4D;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:40px 24px}
@media (max-width:480px){main{padding:24px 16px}}
header{margin-bottom:32px}
.wordmark{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-weight:600;font-size:40px;line-height:1.2;margin:0}
.wordmark::before{content:"";width:24px;height:3px;background:#C2462B;flex:none}
.tagline{color:#5B6B75;margin:4px 0 0}
h2{font-family:Fraunces,serif;font-weight:600;font-size:28px;line-height:1.25;margin:0 0 16px}
section{background:#FFFFFF;border:1px solid #D9D2C3;border-radius:6px;padding:24px;margin-bottom:24px}
@media (max-width:480px){section{padding:16px}}
label,legend{display:block;font-weight:500;margin-bottom:4px}
.field{margin-bottom:16px}
input[type=text],select{width:100%;font:inherit;color:#1F3A4D;background:#FFFFFF;border:1px solid #D9D2C3;border-radius:6px;padding:8px 12px;min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 160px;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
fieldset{border:1px solid #D9D2C3;border-radius:6px;padding:8px 16px 16px;margin:0 0 16px;min-width:0}
legend{padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:8px 24px}
.checks label{display:flex;align-items:center;gap:8px;font-weight:400;margin:0}
.checks input{width:18px;height:18px;margin:0;accent-color:#1F3A4D}
.hint{color:#5B6B75;font-size:14px;margin:4px 0 0}
button{font:inherit;font-weight:500;border-radius:6px;cursor:pointer;min-height:40px;padding:8px 16px;transition:background-color .15s,border-color .15s}
.primary{background:#C2462B;color:#FFFFFF;border:1px solid #C2462B}
.secondary{background:#FFFFFF;color:#1F3A4D;border:1px solid #D9D2C3}
.secondary:hover{border-color:#1F3A4D}
:focus-visible{outline:2px solid #1F3A4D;outline-offset:2px}
.error{color:#1F3A4D;font-weight:500;margin:8px 0 0;border-left:3px solid #1F3A4D;padding-left:8px}
ul{list-style:none;margin:0;padding:0}
.people li{display:inline-block;border:1px solid #D9D2C3;border-radius:6px;padding:4px 12px;margin:0 8px 8px 0}
.list li{border-top:1px solid #D9D2C3;padding:16px 0;display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.list li:first-child{border-top:0;padding-top:0}
.list li:last-child{padding-bottom:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.meta{color:#5B6B75;font-size:14px;margin:4px 0 0}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#2F6B4F}
.label{font-size:14px;color:#5B6B75;display:block;text-align:right}
.list li.bal,.list li.tr{align-items:center}
.empty{color:#5B6B75;margin:0}
h3{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:24px 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main data-testid="app">
<header>
<h1 class="wordmark">Even Keel</h1>
<p class="tagline">Split trip costs fairly and see who owes whom.</p>
</header>

<section aria-labelledby="h-people">
<h2 id="h-people">People</h2>
<form id="person-form" novalidate>
<label for="person-name">Name</label>
<div class="row">
<input type="text" id="person-name" data-testid="person-name" autocomplete="off" aria-describedby="person-error">
<button type="submit" class="primary" data-testid="add-person">Add person</button>
</div>
<div id="person-error" aria-live="polite"></div>
</form>
<div id="people-out" style="margin-top:16px"></div>
</section>

<section aria-labelledby="h-exp">
<h2 id="h-exp">Expenses</h2>
<form id="expense-form" novalidate>
<div class="grid">
<div class="field"><label for="expense-desc">Description</label>
<input type="text" id="expense-desc" data-testid="expense-desc" autocomplete="off"></div>
<div class="field"><label for="expense-amount">Amount (CAD)</label>
<input type="text" id="expense-amount" data-testid="expense-amount" inputmode="decimal" autocomplete="off"></div>
</div>
<div class="field"><label for="expense-payer">Paid by</label>
<select id="expense-payer" data-testid="expense-payer"></select></div>
<fieldset><legend>Split between</legend>
<div class="checks" id="expense-split" data-testid="expense-split"></div>
</fieldset>
<button type="submit" class="primary" data-testid="add-expense">Add expense</button>
<div id="expense-error" aria-live="polite"></div>
</form>
<div id="expenses-out" style="margin-top:24px"></div>
</section>

<section aria-labelledby="h-bal">
<h2 id="h-bal">Balances</h2>
<div id="balances-out"></div>
<h3>Settle up</h3>
<div id="settle-out"></div>
</section>
</main>

<script>
(function(){
var KEY='even-keel-v1';
var fmt=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
var state={people:[],expenses:[],nextId:1};
try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people)&&Array.isArray(s.expenses))state=s;if(!state.nextId)state.nextId=1;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function money(c){return fmt.format(c/100);}
function el(t,a,txt){var e=document.createElement(t);if(a)for(var k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}if(txt!=null)e.textContent=txt;return e;}
var $=function(id){return document.getElementById(id);};

function showError(box,input,msg){
  box.innerHTML='';
  if(input)input.removeAttribute('aria-invalid');
  if(!msg)return;
  var p=el('p',{'class':'error','data-testid':'form-error',role:'alert'},msg);
  box.appendChild(p);
  if(input){input.setAttribute('aria-invalid','true');input.focus();}
}

function shares(exp){
  var order=state.people.filter(function(p){return exp.split.indexOf(p)>=0;});
  var n=order.length,base=Math.floor(exp.cents/n),rem=exp.cents-base*n,r={};
  order.forEach(function(p,i){r[p]=base+(i<rem?1:0);});
  return r;
}
function balances(){
  var b={};state.people.forEach(function(p){b[p]=0;});
  state.expenses.forEach(function(e){
    if(b[e.payer]!==undefined)b[e.payer]+=e.cents;
    var s=shares(e);for(var p in s)if(b[p]!==undefined)b[p]-=s[p];
  });
  return b;
}
function settle(b){
  var cred=[],deb=[];
  state.people.forEach(function(p){if(b[p]>0)cred.push({p:p,c:b[p]});else if(b[p]<0)deb.push({p:p,c:-b[p]});});
  var out=[],i=0,j=0;
  while(i<deb.length&&j<cred.length){
    var m=Math.min(deb[i].c,cred[j].c);
    out.push({from:deb[i].p,to:cred[j].p,c:m});
    deb[i].c-=m;cred[j].c-=m;
    if(!deb[i].c)i++;if(!cred[j].c)j++;
  }
  return out;
}

function renderForm(){
  var payer=$('expense-payer'),prev=payer.value;
  payer.innerHTML='';
  var splitBox=$('expense-split');
  var checked={};var had=splitBox.querySelectorAll('input').length>0;
  splitBox.querySelectorAll('input').forEach(function(c){checked[c.value]=c.checked;});
  splitBox.innerHTML='';
  if(!state.people.length){
    payer.appendChild(el('option',{value:''},'Add people first'));
    splitBox.appendChild(el('p',{'class':'empty'},'Add people above to choose who shares each expense.'));
  }
  state.people.forEach(function(p,i){
    payer.appendChild(el('option',{value:p},p));
    var id='split-'+i,lab=el('label',{'for':id});
    var cb=el('input',{type:'checkbox',id:id,value:p});
    cb.checked=had&&p in checked?checked[p]:true;
    lab.appendChild(cb);lab.appendChild(document.createTextNode(p));
    splitBox.appendChild(lab);
  });
  if(state.people.indexOf(prev)>=0)payer.value=prev;
}

function render(){
  var po=$('people-out');po.innerHTML='';
  if(!state.people.length)po.appendChild(el('p',{'class':'empty'},'Add the first person on your trip to get started.'));
  else{var ul=el('ul',{'class':'people','aria-label':'People on this trip'});
    state.people.forEach(function(p){ul.appendChild(el('li',{'data-testid':'person'},p));});po.appendChild(ul);}

  var eo=$('expenses-out');eo.innerHTML='';
  if(!state.expenses.length)eo.appendChild(el('p',{'class':'empty'},state.people.length?'Add an expense above when someone pays for something.':'Once you add people, log what each person paid.'));
  else{var ul2=el('ul',{'class':'list','aria-label':'Expenses, newest first'});
    state.expenses.slice().reverse().forEach(function(e){
      var li=el('li',{'data-testid':'expense'});
      var d=el('div',{'class':'grow'});
      d.appendChild(el('div',{style:'font-weight:500'},e.desc));
      var splitNames=state.people.filter(function(p){return e.split.indexOf(p)>=0;});
      d.appendChild(el('p',{'class':'meta'},'Paid by '+e.payer+' · Split between '+splitNames.join(', ')));
      li.appendChild(d);
      li.appendChild(el('span',{'class':'money',style:'font-weight:500'},money(e.cents)));
      var btn=el('button',{type:'button','class':'secondary','data-testid':'delete-expense','aria-label':'Remove '+e.desc+', '+money(e.cents)},'Remove');
      btn.addEventListener('click',function(){
        state.expenses=state.expenses.filter(function(x){return x.id!==e.id;});save();render();
        var b=document.querySelector('[data-testid=delete-expense]');(b||$('expense-desc')).focus();
      });
      li.appendChild(btn);ul2.appendChild(li);
    });eo.appendChild(ul2);}

  var b=balances(),bo=$('balances-out');bo.innerHTML='';
  if(!state.people.length)bo.appendChild(el('p',{'class':'empty'},'Add people and expenses to see balances.'));
  else{var ul3=el('ul',{'class':'list'});
    state.people.forEach(function(p){
      var c=b[p];
      var li=el('li',{'class':'bal','data-testid':'balance','data-person':p,'data-cents':String(c)});
      li.appendChild(el('span',{'class':'grow'},p));
      var r=el('div');
      var amt=el('span',{'class':'money'+(c>0?' pos':''),style:'display:block;text-align:right;font-weight:500'},c<0?'−'+money(-c):money(c));
      r.appendChild(amt);
      r.appendChild(el('span',{'class':'label'},c>0?'is owed':c<0?'owes':'is even'));
      li.appendChild(r);ul3.appendChild(li);
    });bo.appendChild(ul3);}

  var so=$('settle-out');so.innerHTML='';
  var t=settle(b);
  if(!t.length)so.appendChild(el('p',{'class':'empty'},state.expenses.length?'Everyone is even. You have nothing to settle.':'Add expenses to see who should pay whom.'));
  else{var ul4=el('ul',{'class':'list'});
    t.forEach(function(x){
      var li=el('li',{'class':'tr','data-testid':'transfer','data-from':x.from,'data-to':x.to,'data-cents':String(x.c)});
      li.appendChild(el('span',{'class':'grow'},x.from+' pays '+x.to));
      li.appendChild(el('span',{'class':'money',style:'font-weight:500'},money(x.c)));
      ul4.appendChild(li);
    });so.appendChild(ul4);}

  renderForm();
}

$('person-form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var inp=$('person-name'),box=$('person-error'),name=inp.value.trim();
  if(!name)return showError(box,inp,'Enter a name.');
  if(name.length>60)return showError(box,inp,'Enter a name of 60 characters or fewer.');
  var low=name.toLowerCase();
  if(state.people.some(function(p){return p.toLowerCase()===low;}))return showError(box,inp,name+' is already on the trip. Enter a different name.');
  state.people.push(name);save();showError(box,inp,'');inp.value='';render();inp.focus();
});

$('expense-form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var box=$('expense-error'),d=$('expense-desc'),a=$('expense-amount'),py=$('expense-payer');
  if(!state.people.length)return showError(box,$('person-name'),'Add at least one person before adding an expense.');
  var desc=d.value.trim();
  if(!desc)return showError(box,d,'Enter a description.');
  var raw=a.value.trim().replace(/^\$/,'').replace(/,/g,'');
  if(!raw)return showError(box,a,'Enter an amount.');
  if(!/^\d*(\.\d*)?$/.test(raw)||raw==='.')return showError(box,a,'Enter the amount as a number, for example 24.50.');
  var parts=raw.split('.');
  if(parts[1]&&parts[1].length>2)return showError(box,a,'Enter an amount with at most 2 decimal places.');
  var cents=parseInt(parts[0]||'0',10)*100+parseInt(((parts[1]||'')+'00').slice(0,2),10);
  if(!(cents>0))return showError(box,a,'Enter an amount greater than $0.');
  if(cents>100000000000)return showError(box,a,'Enter a smaller amount.');
  if(state.people.indexOf(py.value)<0)return showError(box,py,'Choose who paid.');
  var split=[];$('expense-split').querySelectorAll('input:checked').forEach(function(c){split.push(c.value);});
  if(!split.length)return showError(box,$('expense-split').querySelector('input'),'Choose at least one person to split with.');
  state.expenses.push({id:state.nextId++,desc:desc,cents:cents,payer:py.value,split:split});
  save();showError(box,null,'');d.removeAttribute('aria-invalid');a.removeAttribute('aria-invalid');
  d.value='';a.value='';
  $('expense-split').querySelectorAll('input').forEach(function(c){c.checked=true;});
  render();d.focus();
});

render();
})();
</script>
</body>
</html>
