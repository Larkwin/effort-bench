# Model × effort bench: one prompt, many models, many effort levels, N runs each.
# Prices are USD per million tokens, checked against platform.claude.com/docs pricing on 2026-10-21.
# Re-check before a big run; override any value here.

experiment: even-keel-light       # results go to results/<experiment>/
prompt: prompts/prompt-light.md   # personality, anchors and principles only; no exact design rules
system: null                      # optional system prompt file; null = none (tests the raw prompt)

models:
  - id: claude-fable-5-1
    label: Fable 5.1
    price: { input: 10.00, output: 50.00 }
  - id: claude-opus-5-5
    label: Opus 5.5
    price: { input: 4.00, output: 20.00 }
  - id: claude-sonnet-5-5
    label: Sonnet 5.5
    price: { input: 2.00, output: 10.00 }
  - id: claude-haiku-5-5
    label: Haiku 5.5
    price: { input: 0.10, output: 0.50 }   # rate for prompts up to 100k tokens

efforts: [low, medium, high, xhigh]   # max left out: 3 of 4 models used all 128k tokens thinking in the v1 pilot
runs_per_cell: 5                  # independent repeats per model × effort

generation:
  max_tokens: 128000              # hard cap on thinking + output; the current models' maximum
  thinking_display: summarized    # summarized | omitted. Summaries are free and help explain deltas;
                                  # set omitted for the cleanest latency numbers
  concurrency: 4
  shuffle: true                   # interleave cells so time-of-day load doesn't bias one model
  budget_usd: 75                  # the run stops starting new requests past this spend

# Output-token guesses used by `plan` until this experiment has its own measurements.
# These are the v1 pilot's averages across the four models.
estimate_output_tokens: { low: 8000, medium: 13000, high: 26000, xhigh: 61000, max: 128000 }

checks:
  profile: light                  # light: brand lint records a style profile; only the brief's stated points pass/fail
  viewports:
    desktop: { width: 1280, height: 800 }
    mobile: { width: 390, height: 844 }
  allowed_hosts: [fonts.googleapis.com, fonts.gstatic.com]

judge:
  rubric: judge/rubric-light.md   # brand fidelity judged against personality and anchors, not exact rules
  model: claude-opus-5-5          # keep this fixed across an experiment
  effort: high
  passes: 1                       # >1 re-judges each output and reports judge variance
  price: { input: 4.00, output: 20.00 }
  concurrency: 4

pairwise:
  model: claude-opus-5-5          # same judge model as above; change both together if you switch
  effort: medium                  # picking between two is an easier call than scoring from scratch
  per_cell_pair: 2                # run pairs per pair of settings in the round-robin (16 settings → 120 pairs of settings)
  budget_usd: 40                  # synchronous runs stop starting new judgments past this
  prompt: judge/pairwise.md
